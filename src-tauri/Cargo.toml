[package]
name = "cindrixops-cmap-viewer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "cindrixops_cmap_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
