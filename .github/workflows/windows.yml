name: Windows CI and Portable EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  browser-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install the test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Build the screen
        run: npm run build
      - name: Open real maps in a browser and try them
        shell: bash
        run: bash .github/scripts/annotate.sh node tests/e2e/run.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: tests/e2e/out
          if-no-files-found: ignore
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend tests
        run: npm test
      - name: Type and Svelte checks
        shell: bash
        run: bash .github/scripts/annotate.sh npm run check
      - name: Frontend build
        shell: bash
        run: bash .github/scripts/annotate.sh npm run build
      - name: Generate Windows ICO from approved flame PNG
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = [System.Drawing.Image]::FromFile('src-tauri/icons/icon.png')
          $bmp = New-Object System.Drawing.Bitmap(256, 256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::Transparent)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.DrawImage($source, 0, 0, 256, 256)
          $g.Dispose()
          $source.Dispose()
          $handle = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($handle)
          $stream = [System.IO.File]::Create('src-tauri/icons/icon.ico')
          try { $icon.Save($stream) } finally { $stream.Dispose(); $icon.Dispose(); $bmp.Dispose() }
      - name: Rust tests
        shell: bash
        run: bash .github/scripts/annotate.sh cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build standalone Windows executable
        run: npm run tauri build -- --no-bundle
      - name: Upload portable Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CindrixOps-CMAP-Viewer-EXE
          path: src-tauri/target/release/cindrixops-cmap-viewer.exe
          if-no-files-found: error
