name: Windows CI and Installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend tests
        run: npm test
      - name: Type and Svelte checks
        run: npm run check
      - name: Frontend build
        run: npm run build
      - name: Generate required Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(256, 256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(25,31,38))
          $pen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(215,181,109), 12)
          $g.DrawEllipse($pen, 30, 30, 196, 196)
          $g.DrawLine($pen, 128, 15, 128, 241)
          $g.DrawLine($pen, 15, 128, 241, 128)
          $g.Dispose()
          $handle = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($handle)
          $stream = [System.IO.File]::Create('src-tauri/icons/icon.ico')
          $icon.Save($stream)
          $stream.Close()
          $bmp.Save('src-tauri/icons/icon.png', [System.Drawing.Imaging.ImageFormat]::Png)
          $icon.Dispose()
          $bmp.Dispose()
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run tauri build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CindrixOps-CMAP-Viewer-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
